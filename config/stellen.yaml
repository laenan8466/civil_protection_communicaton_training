# Übende Stellen. Nur diese senden/empfangen in der Übung.
# Rufnamen nach Nds. MBl. 2024 Nr. 125 (Johannes = MHD, H = Hannover, H# = Hannover Land/Region).
uebung:
  titel: "Fernmeldeübung Johannes Hannover"
  datum: ""            # leer = Datum wird bei Einspielung handschriftlich ergänzt

kommunikation:
  rufgruppe: "NI_Sonder/K_LS_MHD"
  betriebsart: "TMO"
  hinweis: "Funkverkehr nur zwischen TEL Hannover und den FüSt. Fahrzeuge sind keine Teilnehmer der Übung."

# Alle FüSt (59-12) erreichen dasselbe Telefon/Postfach.
elw:
  telefon: &tel_elw "0170 6349100"
  mail: &mail_elw "elw.hannover@malteser.org"

stellen:
  TEL:
    name: "TEL Hannover"
    rufname: "Joh. H 59-10-1"
    arbeitsmittel: vordruck
    telefon: ""         # unbekannt
    fax: ""
    mail: "stab.hannover@malteser.org"
    funktionen: [S1, S2, S3, S4, S5, S6, "Fachberater Sanität"]
  NORD:
    name: "FüSt Nord"
    alias: "UEA Nord"
    rufname: "Joh. H 59-12-1"
    arbeitsmittel: edp
    auftrag: "Räumung Pflegeeinrichtung Tellkampfschule, Aufnahme Friederikenstift (vulnerable Gruppen)"
    telefon: *tel_elw
    fax: ""
    mail: *mail_elw
    funktionen: &fuegr ["Leitung des Stabes", S1/4/6, S2, S3, "med. Leitung"]
  SUED:
    name: "FüSt Süd"
    alias: "UEA Süd"
    rufname: "Joh. H 59-12-2"
    arbeitsmittel: edp
    auftrag: "Transportorganisation, BR Schützenplatz mit Meldekopf"
    telefon: *tel_elw
    fax: ""
    mail: *mail_elw
    funktionen: *fuegr
  WEST:
    name: "FüSt West"
    alias: "UEA West"
    rufname: "Joh. H 59-12-3"
    arbeitsmittel: edp
    auftrag: "Sanitätsdienst Notunterkunft Schulzentrum Ahlem (UHS, San-Wache)"
    telefon: *tel_elw
    fax: ""
    mail: *mail_elw
    funktionen: *fuegr

# Auswahlwerte
medien: [Telefon, Funk, Fax, Mail, Melder]
vorrang: [normal, Sofort, Blitz]
betreff_arten: [Meldung, Lagemeldung, Anforderung, Auftrag, Anfrage, Antwort, Information]
kategorien:
  fuegr: {name: "FüGr / Stab", soll: 0.6}
  transport: {name: "Transportdisposition", soll: 0.2}
  sandienst: {name: "Sanitätsdienst", soll: 0.2}

